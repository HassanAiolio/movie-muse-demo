# Daily TMDB catalogue refresh. The backend also syncs on boot when the last
# sync is over a day old; this job covers days when nobody visits.
# Needs two repository secrets: BACKEND_URL and SYNC_SECRET.
name: TMDB sync

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$SYNC_SECRET" ]; then
            echo "BACKEND_URL or SYNC_SECRET not configured, skipping."
            exit 0
          fi
          # The first request may wake a sleeping Render instance.
          curl --silent --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 "$BACKEND_URL/health"
          curl --fail --silent --show-error -X POST -H "X-Sync-Secret: $SYNC_SECRET" "$BACKEND_URL/admin/sync"
